apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invernadero-ingress
  namespace: invernadero
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - invernadero.example.com
    - api.invernadero.example.com
    - grafana.invernadero.example.com
    - prometheus.invernadero.example.com
    - jaeger.invernadero.example.com
    - alertmanager.invernadero.example.com
    secretName: invernadero-tls-cert
  rules:
  
  # Frontend
  - host: invernadero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: invernadero-frontend-service
            port:
              number: 80
  
  # Backend API
  - host: api.invernadero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: invernadero-api-service
            port:
              number: 80
  
  # Grafana Dashboards
  - host: grafana.invernadero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
  
  # Prometheus Metrics
  - host: prometheus.invernadero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
  
  # Jaeger Tracing
  - host: jaeger.invernadero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jaeger-service
            port:
              number: 16686
  
  # AlertManager
  - host: alertmanager.invernadero.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alertmanager-service
            port:
              number: 9093

---
# HTTPS redirect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traffic
  namespace: invernadero
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
