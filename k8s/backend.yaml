apiVersion: apps/v1
kind: Deployment
metadata:
  name: invernadero-backend
  namespace: invernadero
  labels:
    app: invernadero-backend
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: invernadero-backend
  template:
    metadata:
      labels:
        app: invernadero-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: gcr.io/invernadero-pro/backend:latest
        imagePullPolicy: Always
        ports:
        - name: api
          containerPort: 8080
          protocol: TCP
        - name: tcp-ingestion
          containerPort: 9000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: invernadero-backend-config
        - secretRef:
            name: invernadero-db-secret
        - secretRef:
            name: invernadero-rabbitmq-secret
        env:
        - name: DB_HOST
          value: "timescaledb-service"
        - name: DB_PORT
          value: "5432"
        - name: RABBIT_HOST
          value: "rabbitmq-service"
        - name: RABBIT_PORT
          value: "5672"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: invernadero-db-secret
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: invernadero-db-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: invernadero-rabbitmq-secret
              key: RABBITMQ_DEFAULT_USER
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: invernadero-rabbitmq-secret
              key: RABBITMQ_DEFAULT_PASS
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: invernadero-api-service
  namespace: invernadero
  labels:
    app: invernadero-backend
spec:
  selector:
    app: invernadero-backend
  ports:
  - name: api
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: tcp-ingestion
    protocol: TCP
    port: 9000
    targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: invernadero-api-lb
  namespace: invernadero
  labels:
    app: invernadero-backend
spec:
  selector:
    app: invernadero-backend
  ports:
  - name: api
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: tcp-ingestion
    protocol: TCP
    port: 9000
    targetPort: 9000
  type: LoadBalancer
