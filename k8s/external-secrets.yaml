apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: github-secrets-store
  namespace: invernadero
spec:
  provider:
    github:
      auth:
        secretRef:
          secretAccessKey:
            name: github-token
            key: token

---
apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: invernadero
type: Opaque
stringData:
  token: "github_pat_YOUR_TOKEN_HERE"

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: docker-registry-credentials
  namespace: invernadero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: github-secrets-store
    kind: SecretStore
  target:
    name: docker-registry-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "docker.io": {
                "auth": "{{ .dockerhubUsername }}:{{ .dockerhubPassword }} | b64enc"
              }
            }
          }
  data:
  - secretKey: dockerhubUsername
    remoteRef:
      key: DOCKERHUB_USERNAME
  - secretKey: dockerhubPassword
    remoteRef:
      key: DOCKERHUB_PASSWORD

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: invernadero
type: kubernetes.io/dockercfg
dockercfg: |
  {
    "docker.io": {
      "username": "YOUR_DOCKERHUB_USERNAME",
      "password": "YOUR_DOCKERHUB_PASSWORD",
      "email": "your-email@example.com",
      "auth": "BASE64_ENCODED_USERNAME_PASSWORD"
    }
  }

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: invernadero-sa
  namespace: invernadero
imagePullSecrets:
- name: docker-registry-secret
