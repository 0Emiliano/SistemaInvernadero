apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: invernadero
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'sistema-invernadero'
        environment: 'kubernetes'
    
    scrape_configs:
      - job_name: 'backend-api'
        static_configs:
          - targets: ['invernadero-api-service:8080']
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - invernadero
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - '/etc/prometheus/rules/*.yml'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: invernadero
data:
  alert_rules.yml: |
    groups:
      - name: sistema-invernadero
        interval: 30s
        rules:
          - alert: HighTemperature
            expr: mediciones_temperature_celsius > 35
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High temperature detected in greenhouse"
              description: "Temperature {{ $value }}°C exceeds threshold (>35°C)"
          
          - alert: BackendAPIDown
            expr: up{job="backend-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend API is down"
              description: "Backend API has been unreachable for 1 minute"
          
          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{pod_name=~"invernadero-.*"} / container_spec_memory_limit_bytes > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Pod {{ $labels.pod_name }} memory usage is {{ $value | humanizePercentage }}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: invernadero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=30d'
          - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-rules
      - name: storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: invernadero
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: LoadBalancer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: invernadero

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: invernadero
