apiVersion: v1
kind: Secret
metadata:
  name: supabase-credentials
  namespace: invernadero
type: Opaque
stringData:
  host: "your-project.supabase.co"
  port: "5432"
  database: "postgres"
  username: "postgres"
  password: "your-secure-password"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: invernadero-backend-config-supabase
  namespace: invernadero
data:
  SPRING_APPLICATION_JSON: |
    {
      "server": {
        "port": 8080
      },
      "spring": {
        "datasource": {
          "url": "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"
        },
        "rabbitmq": {
          "host": "${RABBIT_HOST:rabbitmq-service}",
          "port": "5672"
        },
        "jpa": {
          "hibernate": {
            "ddl-auto": "validate"
          },
          "show-sql": false,
          "properties": {
            "hibernate": {
              "format_sql": false,
              "jdbc": {
                "batch_size": 20,
                "fetch_size": 50
              },
              "order_inserts": true,
              "order_updates": true
            }
          }
        }
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invernadero-backend
  namespace: invernadero
  labels:
    app: invernadero-backend
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: invernadero-backend
  template:
    metadata:
      labels:
        app: invernadero-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: invernadero-backend:latest
        imagePullPolicy: Never
        ports:
        - name: api
          containerPort: 8080
          protocol: TCP
        - name: tcp-ingestion
          containerPort: 9000
          protocol: TCP
        envFrom:
        - secretRef:
            name: supabase-credentials
        - secretRef:
            name: invernadero-rabbitmq-secret
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: database
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-credentials
              key: password
        - name: RABBIT_HOST
          value: "rabbitmq-service"
        - name: RABBIT_PORT
          value: "5672"
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: invernadero-rabbitmq-secret
              key: RABBITMQ_DEFAULT_USER
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: invernadero-rabbitmq-secret
              key: RABBITMQ_DEFAULT_PASS
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx512m -XX:+UseG1GC"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false

---
apiVersion: v1
kind: Service
metadata:
  name: invernadero-api-service
  namespace: invernadero
  labels:
    app: invernadero-backend
spec:
  selector:
    app: invernadero-backend
  ports:
  - name: api
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: tcp-ingestion
    protocol: TCP
    port: 9000
    targetPort: 9000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: invernadero-api-lb
  namespace: invernadero
  labels:
    app: invernadero-backend
spec:
  selector:
    app: invernadero-backend
  ports:
  - name: api
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: tcp-ingestion
    protocol: TCP
    port: 9000
    targetPort: 9000
  type: LoadBalancer
