apiVersion: apps/v1
kind: Deployment
metadata:
  name: invernadero-frontend
  namespace: invernadero
  labels:
    app: invernadero-frontend
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: invernadero-frontend
  template:
    metadata:
      labels:
        app: invernadero-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: invernadero-frontend:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: invernadero-frontend-service
  namespace: invernadero
  labels:
    app: invernadero-frontend
spec:
  selector:
    app: invernadero-frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: invernadero-frontend-lb
  namespace: invernadero
  labels:
    app: invernadero-frontend
spec:
  selector:
    app: invernadero-frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
