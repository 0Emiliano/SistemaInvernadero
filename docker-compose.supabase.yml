services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      DB_PROVIDER: supabase-postgres
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-vwtwbgnbmysjcjvolvbi}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-postgres}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Define SUPABASE_DB_PASSWORD in .env}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
