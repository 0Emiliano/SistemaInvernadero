spring.application.name=sistema-invernadero

# Datasource - Pointing to Docker Compose 'timescaledb' service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/invernadero_db
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ - Pointing to Docker Compose 'rabbitmq' service
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Jackson support for Java 8 Time
spring.jackson.serialization.write-dates-as-timestamps=false

# TCP Port (as requested in architecture)
server.port=8080

# Kubernetes health probes
management.endpoints.web.exposure.include=health,info,prometheus,metrics,trace
management.endpoint.health.probes.enabled=true

# Prometheus Metrics
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Micrometer Tracing - Jaeger
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://jaeger-service:9411/api/v2/spans

# Loki Logging
logging.config=classpath:logback-spring.xml

# JWT Configuration
jwt.secret=${JWT_SECRET:your-very-long-secure-secret-key-at-least-64-chars-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
