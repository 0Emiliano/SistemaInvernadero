version: '3.8'

services:
  # RabbitMQ Pivot de Mensajería
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # TimescaleDB Persistencia de Series de Tiempo
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: invernadero_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password

  # Nuestra Aplicación Java (Backend)
  app:
    build: .
    ports:
      - "3000:3000"
      - "9000:9000"
    depends_on:
      - rabbitmq
      - timescaledb
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/invernadero_db
      SPRING_RABBITMQ_HOST: rabbitmq
